services:
  postgres-db:
    image: postgres:16-alpine
    container_name: express_postgres_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: api
    container_name: express_backend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app/apps/api
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_HOST=postgres-db
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - postgres-db
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: web
    container_name: react_frontend
    ports:
      - "8080:5173"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app/apps/web
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:
networks:
  app-network:
    driver: bridge
