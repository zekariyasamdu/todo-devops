name: Deploy Infrastructure

# This workflow is triggered when the "Build and Push to Artifact Registry"
# workflow completes successfully on the main branch.
on:
  workflow_run:
    workflows: ["Build and Push to Artifact Registry"]
    types: [completed]
    branches: [main]

# defining global envs using variables
# TF_VAR_ prefix has special meaning in OpenTofu, it is used to pass variables to the Terraform configuration.
env:
  TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./deploy/opentofu # For every `run` command in this job, pretend we're already inside ./deploy/opentofu.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

        # The credentials_json contians a credentials for a service account with the required permissions to deploy images to cloud run.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TOFU_SA_KEY }}
        # This installs OpenTofu
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.0

        # This installs OpenTofu
        # It initializes things like: providers, backend/state configuration, modules dependency information
      - name: Tofu Init
        run: tofu init

        # review they changes that will be applied to the infrastructure and save them to a plan file called tfplan
      - name: Tofu Plan
        run: tofu plan -out=tfplan

        # This applies the changes to the infrastructure based on the plan file tfplan
      - name: Tofu Apply
        run: tofu apply -auto-approve tfplan
