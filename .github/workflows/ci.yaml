name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # - name: Lint check web and api
      #   run: yarn workspace web lint & yarn workspace api lint
      #
      # - name: Format check web and api
      #   run: yarn workspace api format:check & yarn workspace web format:check

      - name: Build frontend
        run: yarn workspace web build
