name: Build and Push to Artifact Registry

# This workflow is triggered when the "CI" workflow completes successfully on the main branch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# defining global envs using variables
env:
  GAR_LOCATION: africa-south1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: training
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # only when "CI" is a scuccess.
    runs-on: ubuntu-latest
    permissions: # the permissions required for the job to run.
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with: # checkout the commit that triggered the workflow run, not main.
          ref: ${{ github.event.workflow_run.head_sha }}

        # The credentials_json contians a credentials for a service account with the required permissions to push images to Artifact Registry.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

        # This installs/configures the Google Cloud CLI, gcloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

        # Telling Docker When you interact with Google's Artifact Registry registry, use my Google Cloud credentials.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

        # Buildx is Docker's more advanced build system: better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image # build and push the backend image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api-runner
          build-args: |
            APP_NAME=api
          push: true
          tags:
            | # produce two tags for the image: one with the commit SHA and one with "latest"
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest
          cache-from: type=gha # so that the cache can be reused in future builds.
          cache-to: type=gha,mode=max

      - name: Build and push frontend image # build and push the frontend image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web-runner
          build-args: |
            APP_NAME=web
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
